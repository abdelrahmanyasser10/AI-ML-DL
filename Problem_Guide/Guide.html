<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML/DL Visual Decision Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #f72585;
            --success: #4cc9f0;
            --danger: #f94144;
            --warning: #f8961e;
            --info: #7209b7;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --bg-gradient: linear-gradient(135deg, #4361ee, #3a0ca3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: var(--bg-gradient);
            color: white;
            padding: 3rem 0 4rem;
            text-align: center;
            margin-bottom: -2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            position: relative;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 0.8rem;
            font-weight: 300;
            position: relative;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .progress-container {
            width: 100%;
            background-color: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin: 2rem auto;
            height: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary-light));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.65, 0, 0.35, 1);
            border-radius: 20px;
        }
        
        .progress-text {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }
        
        .question-card {
            border-left: 5px solid var(--primary);
        }
        
        .result-card {
            border-left: 5px solid var(--success);
            display: none;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1rem;
        }
        
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        .radio-option {
            flex: 1;
            min-width: 150px;
        }
        
        .radio-option input {
            display: none;
        }
        
        .radio-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            height: 100%;
        }
        
        .radio-option input:checked + label {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .radio-option label:hover {
            border-color: var(--primary-light);
        }
        
        .radio-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary);
            transition: all 0.3s;
        }
        
        .radio-option input:checked + label .radio-icon {
            color: white;
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            background-color: #3a56e8;
        }
        
        .btn-secondary {
            background-color: var(--gray);
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .recommendation {
            background: linear-gradient(135deg, var(--success), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
        }
        
        .details {
            margin-top: 25px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-left: 4px solid var(--info);
        }
        
        .algorithm-card {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: white;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .algorithm-icon {
            font-size: 2.5rem;
            color: var(--primary);
            min-width: 50px;
            text-align: center;
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .feature {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 3px solid var(--primary);
        }
        
        .feature h4 {
            margin-top: 0;
            color: var(--info);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        
        .feature-icon {
            color: var(--secondary);
            font-size: 1.5rem;
        }
        
        .hidden {
            display: none;
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            color: var(--gray);
            cursor: help;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 250px;
            background-color: var(--dark);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.9rem;
            font-weight: normal;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        .visualization {
            margin: 30px 0;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .chart-container {
            height: 250px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 0 20px;
            gap: 15px;
        }
        
        .chart-bar {
            position: relative;
            background: linear-gradient(to top, var(--primary), var(--primary-light));
            width: 50px;
            height: 0;
            border-radius: 8px 8px 0 0;
            transition: height 1s cubic-bezier(0.65, 0, 0.35, 1);
        }
        
        .chart-label {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--dark);
        }
        
        .chart-value {
            position: absolute;
            top: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
        }

        .flowchart-container {
            width: 100%;
            overflow-x: auto;
            margin: 30px 0;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .flowchart {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 800px;
        }

        .flowchart-step {
            position: relative;
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin: 15px 0;
            width: 80%;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .flowchart-arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid var(--primary);
            margin: 0 auto;
        }

        .flowchart-decision {
            background: var(--info);
            width: 60%;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        .flowchart-branch {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin: 15px 0;
        }

        .flowchart-branch-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }

        .flowchart-branch-label {
            background: var(--secondary);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .features {
                flex-direction: column;
            }
            
            .radio-group {
                flex-direction: column;
            }
            
            .radio-option {
                min-width: 100%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .recommendation {
                font-size: 1.1rem;
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .chart-container {
                flex-direction: column;
                height: auto;
                align-items: center;
                gap: 40px;
            }
            
            .chart-bar {
                width: 80%;
                height: 50px;
                flex-direction: row;
                border-radius: 0 8px 8px 0;
            }
            
            .chart-label {
                bottom: auto;
                top: -25px;
                left: 0;
                text-align: left;
            }
            
            .chart-value {
                top: auto;
                left: 20px;
                right: auto;
                text-align: left;
            }

            .flowchart-step,
            .flowchart-decision {
                width: 90%;
            }

            .flowchart-branch {
                flex-direction: column;
                align-items: center;
            }

            .flowchart-branch-path {
                width: 90%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>ML/DL Visual Decision Guide</h1>
            <p class="subtitle">Discover the perfect machine learning approach for your project</p>
        </div>
    </header>
    
    <div class="container">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        
        <div class="card question-card" id="questionCard">
            <div id="questionContainer">
                <!-- Questions will be dynamically inserted here -->
            </div>
            
            <div class="btn-group">
                <button type="button" id="prevBtn" class="btn-secondary hidden">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button type="button" id="nextBtn">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
        
        <div class="card result-card" id="resultCard">
            <h2><i class="fas fa-check-circle" style="color: var(--success);"></i> Recommendation</h2>
            <div id="recommendation" class="recommendation">
                <i class="fas fa-lightbulb"></i>
                <span id="mainRecommendation"></span>
            </div>
            
            <div class="visualization">
                <h3><i class="fas fa-chart-bar" style="color: var(--info);"></i> Approach Comparison</h3>
                <div class="chart-container" id="chartContainer">
                    <!-- Chart bars will be dynamically inserted here -->
                </div>
            </div>
            
            <div class="details">
                <h3><i class="fas fa-question-circle" style="color: var(--info);"></i> Why this approach?</h3>
                <p id="reasoning"></p>
                
                <h3><i class="fas fa-cogs" style="color: var(--info);"></i> Implementation Details</h3>
                <div id="implementation"></div>
            </div>
            
            <div class="features">
                <div class="feature">
                    <h4><i class="fas fa-project-diagram feature-icon"></i> Suggested Algorithms</h4>
                    <ul id="algorithms" style="list-style-type: none; padding-left: 0;">
                        <!-- Algorithms will be inserted here -->
                    </ul>
                </div>
                
                <div class="feature">
                    <h4><i class="fas fa-tools feature-icon"></i> Suggested Tools</h4>
                    <ul id="tools" style="list-style-type: none; padding-left: 0;">
                        <!-- Tools will be inserted here -->
                    </ul>
                </div>
                
                <div class="feature">
                    <h4><i class="fas fa-road feature-icon"></i> Next Steps</h4>
                    <ul id="nextSteps" style="list-style-type: none; padding-left: 0;">
                        <!-- Next steps will be inserted here -->
                    </ul>
                </div>
            </div>

            <div class="flowchart-container">
                <h3><i class="fas fa-project-diagram" style="color: var(--info);"></i> Implementation Flowchart</h3>
                <div class="flowchart" id="flowchart">
                    <!-- Flowchart will be dynamically inserted here -->
                </div>
            </div>
            
            <div class="btn-group" style="justify-content: center; margin-top: 40px;">
                <button type="button" id="restartBtn" class="btn-secondary">
                    <i class="fas fa-redo"></i> Start New Analysis
                </button>
            </div>
        </div>
    </div>

    <script>
        // Questions data
        const questions = [
            {
                id: 'problemType',
                question: 'What type of problem are you solving?',
                type: 'radio',
                options: [
                    { value: 'classification', label: 'Classification', icon: 'fas fa-tags' },
                    { value: 'regression', label: 'Regression', icon: 'fas fa-chart-line' },
                    { value: 'clustering', label: 'Clustering', icon: 'fas fa-object-group' },
                    { value: 'nlp', label: 'Natural Language', icon: 'fas fa-language' },
                    { value: 'cv', label: 'Computer Vision', icon: 'fas fa-image' },
                    { value: 'timeseries', label: 'Time Series', icon: 'fas fa-clock' }
                ],
                tooltip: 'Select the category that best describes your machine learning task'
            },
            {
                id: 'dataSize',
                question: 'Approximate size of your dataset:',
                type: 'radio',
                options: [
                    { value: 'small', label: 'Small (<1k samples)', icon: 'fas fa-database' },
                    { value: 'medium', label: 'Medium (1k-100k)', icon: 'fas fa-database' },
                    { value: 'large', label: 'Large (>100k)', icon: 'fas fa-database' }
                ],
                tooltip: 'The size of your dataset affects which algorithms will work best'
            },
            {
                id: 'dataType',
                question: 'What type of data do you have?',
                type: 'radio',
                options: [
                    { value: 'tabular', label: 'Tabular/Structured', icon: 'fas fa-table' },
                    { value: 'text', label: 'Text', icon: 'fas fa-font' },
                    { value: 'image', label: 'Image', icon: 'fas fa-image' },
                    { value: 'timeseries', label: 'Time Series', icon: 'fas fa-clock' },
                    { value: 'graph', label: 'Graph/Network', icon: 'fas fa-project-diagram' }
                ],
                tooltip: 'Different data types require different processing approaches'
            },
            {
                id: 'requirements',
                question: 'What are your most important requirements?',
                type: 'radio',
                options: [
                    { value: 'accuracy', label: 'Maximum Accuracy', icon: 'fas fa-bullseye' },
                    { value: 'speed', label: 'Prediction Speed', icon: 'fas fa-tachometer-alt' },
                    { value: 'interpretability', label: 'Interpretability', icon: 'fas fa-search' },
                    { value: 'training_time', label: 'Fast Training', icon: 'fas fa-stopwatch' }
                ],
                tooltip: 'Your priorities will help determine the best tradeoffs'
            },
            {
                id: 'hardware',
                question: 'What hardware will you use?',
                type: 'radio',
                options: [
                    { value: 'cpu', label: 'CPU Only', icon: 'fas fa-microchip' },
                    { value: 'gpu', label: 'GPU Available', icon: 'fas fa-microchip' },
                    { value: 'tpu', label: 'TPU Available', icon: 'fas fa-microchip' },
                    { value: 'edge', label: 'Edge Device', icon: 'fas fa-mobile-alt' }
                ],
                tooltip: 'Hardware capabilities affect which models are practical'
            }
        ];

        // User responses
        const userResponses = {};
        let currentQuestionIndex = 0;

        // DOM elements
        const questionContainer = document.getElementById('questionContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const questionCard = document.getElementById('questionCard');
        const resultCard = document.getElementById('resultCard');

        // Initialize the application
        function init() {
            showQuestion(currentQuestionIndex);
            updateProgressBar();
            
            // Event listeners
            nextBtn.addEventListener('click', nextQuestion);
            prevBtn.addEventListener('click', prevQuestion);
            restartBtn.addEventListener('click', restartQuestionnaire);
        }

        // Show current question
        function showQuestion(index) {
            const question = questions[index];
            
            // Hide/show navigation buttons
            prevBtn.classList.toggle('hidden', index === 0);
            nextBtn.innerHTML = index === questions.length - 1 ? 
                '<i class="fas fa-check-circle"></i> Get Recommendations' : 
                'Next <i class="fas fa-arrow-right"></i>';
            
            // Create question HTML
            let html = `
                <h2>${question.question} <span class="tooltip"><i class="fas fa-info-circle"></i>
                    <span class="tooltiptext">${question.tooltip}</span>
                </span></h2>
                <div class="form-group">
            `;
            
            if (question.type === 'radio') {
                html += '<div class="radio-group">';
                question.options.forEach(option => {
                    const isChecked = userResponses[question.id] === option.value ? 'checked' : '';
                    html += `
                        <div class="radio-option">
                            <input type="radio" id="${question.id}_${option.value}" 
                                   name="${question.id}" value="${option.value}" ${isChecked}>
                            <label for="${question.id}_${option.value}">
                                <i class="${option.icon} radio-icon"></i>
                                <span>${option.label}</span>
                            </label>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            html += '</div>';
            
            questionContainer.innerHTML = html;
            
            // Add event listeners to radio buttons
            if (question.type === 'radio') {
                document.querySelectorAll(`input[name="${question.id}"]`).forEach(radio => {
                    radio.addEventListener('change', function() {
                        userResponses[question.id] = this.value;
                    });
                });
            }
        }

        // Update progress bar
        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${Math.round(progress)}%`;
        }

        // Go to next question
        function nextQuestion() {
            // Validate current question has response
            const currentQuestion = questions[currentQuestionIndex];
            if (!userResponses[currentQuestion.id] && currentQuestionIndex < questions.length - 1) {
                alert('Please select an option to continue');
                return;
            }
            
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
                updateProgressBar();
            } else {
                // Show results
                showResults();
            }
        }

        // Go to previous question
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion(currentQuestionIndex);
                updateProgressBar();
            }
        }

        // Restart questionnaire
        function restartQuestionnaire() {
            currentQuestionIndex = 0;
            for (const key in userResponses) {
                delete userResponses[key];
            }
            questionCard.style.display = 'block';
            resultCard.style.display = 'none';
            showQuestion(currentQuestionIndex);
            updateProgressBar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Create flowchart based on recommendation
        function createFlowchart(recommendation) {
            const flowchart = document.getElementById('flowchart');
            flowchart.innerHTML = '';

            const { problemType, dataSize, dataType, hardware, requirements } = userResponses;

            // Start
            let html = `
                <div class="flowchart-step">
                    <i class="fas fa-play"></i> Start ${problemType.toUpperCase()} Project
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Data Preparation
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-database"></i> Prepare ${dataType} Data (${dataSize} size)
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Model Selection
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-project-diagram"></i> Select ${recommendation.mainRecommendation}
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Algorithm Choice
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-cogs"></i> Choose ${recommendation.algorithms[0]} (${requirements}-focused)
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Hardware Consideration
            let hardwareStep = '';
            if (hardware === 'gpu') {
                hardwareStep = 'Utilize GPU for faster training';
            } else if (hardware === 'edge') {
                hardwareStep = 'Optimize for edge deployment (quantization)';
            } else if (hardware === 'tpu') {
                hardwareStep = 'Leverage TPU for large-scale training';
            } else {
                hardwareStep = 'Train on CPU';
            }
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-microchip"></i> ${hardwareStep}
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Implementation
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-code"></i> Implement with ${recommendation.tools[0]}
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Evaluation
            html += `
                <div class="flowchart-step">
                    <i class="fas fa-chart-line"></i> Evaluate Model Performance
                </div>
                <div class="flowchart-arrow"></div>
            `;

            // Deployment Decision
            html += `

        // Populate list with items

            const list = document.getElementById(elementId);
            list.innerHTML = '';
            items.forEach(item => {

                li.style.marginBottom = '10px';
                li.style.display = 'flex';
                li.style.alignItems = 'center';
                li.style.gap = '10px';

        // Create comparison chart
        function createComparisonChart(comparisonData, mainRecommendation) {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';
            
            // Calculate max value for scaling
            const maxValue = Math.max(...comparisonData.map(item => item.value));
            
            comparisonData.forEach((item, index) => {
                const barContainer = document.createElement('div');
                barContainer.style.display = 'flex';
                barContainer.style.flexDirection = 'column';
                barContainer.style.alignItems = 'center';
                barContainer.style.flex = '1';
                
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                const normalizedHeight = (item.value / maxValue) * 100;
                bar.style.height = `${normalizedHeight}%`;
                
                // Highlight the recommended approach
                const isRecommended = item.label.toLowerCase().includes(mainRecommendation.toLowerCase());
                bar.style.background = isRecommended 
                    ? 'linear-gradient(to top, var(--success), #3aafa9)' 
                    : 'linear-gradient(to top, var(--primary), var(--primary-light))';
                if (isRecommended) {
                    bar.style.border = '2px solid var(--success)';
                    bar.style.boxShadow = '0 0 10px var(--success)';
                }
                
                const value = document.createElement('div');
                value.className = 'chart-value';
                value.textContent = item.value;
                
                const label = document.createElement('div');
                label.className = 'chart-label';
                label.textContent = item.label;
                
                bar.appendChild(value);
                barContainer.appendChild(bar);
                barContainer.appendChild(label);
                container.appendChild(barContainer);
                
                // Animate the bar after a short delay
                setTimeout(() => {
                    bar.style.height = `${normalizedHeight}%`;
                }, index * 150);
            });
        }
